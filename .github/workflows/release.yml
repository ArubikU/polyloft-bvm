name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows binary
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: Build
        run: go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/polyloft-bvm-windows-amd64.exe ./cmd/polyloft-bvm
      - uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: dist/polyloft-bvm-windows-amd64.exe

  build-linux:
    name: Build Linux binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: Install Linux deps
        run: sudo apt-get install -y libwayland-dev libx11-dev libxkbcommon-dev libgles2-mesa-dev libegl1-mesa-dev libxrandr-dev libxcursor-dev libxinerama-dev libxi-dev
      - name: Build amd64
        env:
          GOARCH: amd64
        run: go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/polyloft-bvm-linux-amd64 ./cmd/polyloft-bvm
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: dist/polyloft-bvm-linux-amd64

  build-macos:
    name: Build macOS binaries
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: Build amd64
        env:
          GOARCH: amd64
        run: go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/polyloft-bvm-macos-amd64 ./cmd/polyloft-bvm
      - name: Build arm64
        env:
          GOARCH: arm64
        run: go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/polyloft-bvm-macos-arm64 ./cmd/polyloft-bvm
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/

  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
